[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ece-test-harness"
version = "2026.4.5"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "requests",
    "autograder-cli",
]

[project.optional-dependencies]
# Pinned so lint and test results are reproducible. lint.sh runs whatever
# pyright pip resolves, so an unpinned toolchain lets a new pyright or numpy
# release fail CI on a branch that changed nothing -- which is exactly what
# happened between 2026.4.4 and 2026.4.5. Installing the package itself stays
# unconstrained; only the dev environment is pinned.
dev = [
    "pytest==9.1.1",
    "pyright==1.1.411",
    "ruff==0.16.5",
    "numpy==2.5.2",
    "autograder-cli==2026.8.0",
]

[project.scripts]
ece-grade = "ece_test_harness.main:main"
ece-configure-projects = "ece_test_harness.scripts.configure_projects:cli"
ece-save-projects = "ece_test_harness.scripts.save_projects:cli"
ece-test-solutions = "ece_test_harness.scripts.test_solutions:cli"
ece-publish-projects = "ece_test_harness.scripts.publish_projects:cli"

[tool.ruff]
line-length = 100
exclude = ["grader_examples/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ece_test_harness = ["*.jl", "*.m"]
